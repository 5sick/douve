<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="/static/i18n-en.js"></script>
<script src="/static/i18n.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Douve 로그인</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0c1424">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/icons.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body data-page="login">
<div class="center">
  <div class="card login">
    <div class="logo" id="logo"></div>
    <h1>Douve</h1>
    <p class="sub">작은 서버들을 위한 보안 현관</p>
    <div class="stack">
      <button id="passkey-login" class="primary" hidden>패스키로 로그인</button>
      <div class="divider" id="or" hidden>또는</div>
      <a id="google-login" class="btn" href="/auth/google/start">Google 계정으로 로그인</a>
    </div>
    <details class="recovery" id="recovery-box">
      <summary>패스키를 잃어버렸나요? 복구 코드로 로그인</summary>
      <form id="recovery-form" class="stack">
        <input id="recovery-code" autocomplete="one-time-code" autocapitalize="off" spellcheck="false"
               placeholder="xxxx-xxxx-xxxx" maxlength="40" required aria-label="복구 코드">
        <button type="submit">복구 코드로 로그인</button>
        <div class="meta">코드는 한 번씩만 쓸 수 있습니다. 로그인하면 새 패스키를 등록하세요.</div>
      </form>
    </details>
    <p id="msg" class="msg error" role="alert"></p>
    <div class="footer"><a href="/privacy">개인정보처리방침</a></div>
  </div>
</div>
</body>
</html>
