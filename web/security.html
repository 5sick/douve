<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="/static/i18n-en.js"></script>
<script src="/static/i18n.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Douve 보안</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0c1424">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/icons.js" defer></script>
<script src="/static/app.js" defer></script>
<script src="/static/dashboard.js" defer></script>
</head>
<body data-page="security" data-shell="security">
<main class="wide">
  <header class="top">
    <div>
      <h1>보안</h1>
      <div class="meta" id="summary">불러오는 중…</div>
    </div>
    <div class="actions">
    </div>
  </header>

  <p class="meta">SSH 로그인, 관리 계정이 아닌 sudo, 계정·중요 파일 변경, 새로 열린 포트를 감시합니다.
    Douve 터미널에서 직접 한 작업은 알리지 않습니다. "확인함"은 24시간 동안 같은 일로 알리지 않고, "문제 없음"은 앞으로 계속 알리지 않습니다.</p>

  <h2>보안 점검표</h2>
  <p class="meta">서버마다 출입에 관한 설정을 점검합니다 (접속할 때와 6시간마다). "고치기"는 그 서버·그 항목에 대한 패스키 서명을
    서버가 직접 확인한 뒤에만 실행됩니다.</p>
  <div id="checkup" class="stack"></div>

  <div class="row"><h2>확인이 필요한 이슈</h2>
    <button id="ack-all" class="small" hidden>모두 확인함</button></div>
  <ul class="list" id="open"></ul>

  <h2>처리한 이슈</h2>
  <ul class="list" id="closed"></ul>

  <div class="row"><h2>최근 기록</h2>
    <select id="kind">
      <option value="">전체</option>
      <option value="ssh_login">SSH 로그인</option>
      <option value="ssh_fail">SSH 실패</option>
      <option value="sudo">sudo</option>
      <option value="su">su</option>
      <option value="account">계정 변경</option>
      <option value="file_changed">파일 변경</option>
      <option value="port_opened">새 포트</option>
    </select></div>
  <ul class="list" id="events"></ul>

  <p id="msg" class="msg" role="status"></p>
</main>
</body>
</html>
