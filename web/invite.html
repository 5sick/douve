<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="/static/i18n-en.js"></script>
<script src="/static/i18n.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Douve 초대</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0c1424">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/icons.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body data-page="invite">
<div class="center">
  <div class="card login">
    <div class="logo" id="logo"></div>
    <h1>Douve</h1>
    <p class="sub" id="invite-sub">초대를 확인하는 중…</p>
    <div class="stack">
      <label class="field" id="invite-name-box" hidden>이 기기의 이름 (예: 맥북, 아이폰)
        <input id="invite-name" maxlength="60" autocomplete="off">
      </label>
      <button id="invite-accept" class="primary" hidden>패스키 만들고 시작하기</button>
    </div>
    <p class="meta" id="invite-help" hidden>지문·얼굴·화면 잠금 PIN으로 만드는 패스키가 이 Douve의 열쇠가 됩니다. 비밀번호는 없습니다.
      다른 기기는 로그인한 뒤 계정 화면에서 추가할 수 있습니다.</p>
    <p id="msg" class="msg error" role="alert"></p>
  </div>
</div>
</body>
</html>
