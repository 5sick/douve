# node1(리버스 프록시)에 두는 Douve Hub 가상호스트.
# Hub는 node2의 WireGuard 주소(10.200.0.2:8700)에서 수신하고, node1만 접근한다.
server {
    listen 443 ssl;
    server_name douve.example.com;
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Agent 상시 접속 (WebSocket). WireGuard 밖의 새 서버가 공개 주소로 붙을 때 사용.
    location = /api/agent/connect {
        proxy_pass http://10.200.0.2:8700;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://10.200.0.2:8700;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name douve.example.com;
    return 301 https://$host$request_uri;
}
