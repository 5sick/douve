# 기존 서비스(Homepage, Kuma 등)를 Douve 로그인으로 보호하는 조각.
# /etc/nginx/snippets/douve-auth.conf 로 두고, 보호할 server 블록 안에서 include 한다:
#
#   server {
#       server_name kuma.example.com;
#       include snippets/douve-auth.conf;
#       location / {
#           auth_request /_douve_auth;
#           auth_request_set $douve_user $upstream_http_x_douve_user;
#           proxy_set_header X-Douve-User $douve_user;   # 필요하면 뒤쪽 서비스에 사용자 전달
#           proxy_pass http://10.200.0.3:3001/;
#       }
#   }

location = /_douve_auth {
    internal;
    proxy_pass http://10.200.0.2:8700/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
}

# 로그인이 안 되어 있으면 Douve 로그인 화면으로 보냈다가 원래 주소로 돌아온다.
# (nginx 기본 기능만으로는 rd 값을 URL 인코딩할 수 없어, 쿼리 문자열의 '&' 뒤는 잘릴 수 있다)
error_page 401 = @douve_login;
location @douve_login {
    return 302 https://douve.example.com/login?rd=$scheme://$http_host$request_uri;
}
