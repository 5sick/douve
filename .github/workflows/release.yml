name: release

# v로 시작하는 태그를 푸시하면 Hub(정적)·Agent 바이너리를 빌드해 GitHub Release로 올린다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hub:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: 정적 douve-hub 빌드 (Alpine/musl)
        run: docker build -f packaging/hub-static/Dockerfile --build-arg VERSION=${GITHUB_REF_NAME} -o type=local,dest=out .
      - run: file out/douve-hub-linux-${{ matrix.arch }} && out/douve-hub-linux-${{ matrix.arch }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: hub-${{ matrix.arch }}
          path: |
            out/douve-hub-linux-${{ matrix.arch }}
            out/THIRD_PARTY_LICENSES-hub.txt

  agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - run: make agent
      - uses: actions/upload-artifact@v4
        with:
          name: agent
          path: dist/

  release:
    needs: [hub, agent]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: 산출물 정리·체크섬
        run: |
          mkdir rel
          cp art/hub-amd64/douve-hub-linux-amd64 art/hub-arm64/douve-hub-linux-arm64 rel/
          cp art/hub-amd64/THIRD_PARTY_LICENSES-hub.txt rel/  # 두 아키텍처가 같은 내용
          cp art/agent/douve-agent-linux-* art/agent/VERSION art/agent/THIRD_PARTY_LICENSES-agent.txt rel/
          cp LICENSE rel/LICENSE.txt
          cp deploy/install.sh rel/install.sh 2>/dev/null || true
          chmod +x rel/douve-*
          cd rel && sha256sum douve-* > SHA256SUMS && cat SHA256SUMS
      - name: 릴리스 서명 (minisign 호환, Agent·설치기가 확인)
        env:
          DOUVE_SIGNING_KEY: ${{ secrets.DOUVE_SIGNING_KEY }}
        run: |
          test -n "$DOUVE_SIGNING_KEY" || { echo "DOUVE_SIGNING_KEY 비밀값이 없습니다"; exit 1; }
          chmod +x art/agent/douve-sign
          art/agent/douve-sign sign - rel/SHA256SUMS "${GITHUB_REF_NAME}"
          cat rel/SHA256SUMS.minisig
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" rel/* --title "Douve $tag" --generate-notes || gh release upload "$tag" rel/* --clobber
